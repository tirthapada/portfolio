services:
  # 1. Backend API Web Service
  - type: web
    name: portfolio-api-server
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000

  # 2. Frontend 3D Portfolio Static Site
  - type: web
    name: tirthapada-portfolio
    runtime: static
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/tirthapada-portfolio run build
    staticPublishPath: artifacts/tirthapada-portfolio/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
