kind = "web"
previewPath = "/"
title = "Tirthapada 3D Portfolio"
description = "A cinematic, scroll-driven personal portfolio for Tirthapada Panda, combining a live background video, interactive 3D depth, AI and cybersecurity storytelling, and project highlights."
version = "1.0.0"
id = "artifacts/tirthapada-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20162

[services.development]
run = "pnpm --filter @workspace/tirthapada-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tirthapada-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/tirthapada-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20162"
BASE_PATH = "/"
